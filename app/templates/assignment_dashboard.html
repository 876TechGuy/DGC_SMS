{% extends "base.html" %}
{% block title %}Assignment Dashboard - DGC SMS{% endblock %}

{% block content %}

        <h2><i class="bi bi-clipboard2-check"></i> Assignment Dashboard</h2>
        <p class="text-muted mb-0 mt-1" style="font-size:.83rem;">

<!-- Widget Application Script -->
